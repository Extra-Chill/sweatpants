name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish immutable checkout release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          tag="checkout-${sha}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$sha" --title "Sweatpants ${sha:0:12}" --generate-notes
          fi
